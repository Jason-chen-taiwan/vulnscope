name: Release CLI

# Triggered by tags like cli-v0.1.0 / cli-v1.2.3. Publishes the
# `vulnscope` package to npm. The tag form keeps web-app releases
# (which use a different tag scheme or none) cleanly separated.
on:
  push:
    tags:
      - "cli-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # NOTE: do NOT set `registry-url` here. When set, setup-node writes
      # an `.npmrc` with `_authToken=${NODE_AUTH_TOKEN}`, and the empty
      # token in CI defeats OIDC trusted publishing — npm sees a dummy
      # auth header and 404s instead of falling back to OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test CLI
        run: pnpm --filter vulnscope test

      - name: Build CLI
        run: pnpm --filter vulnscope build

      # npm Trusted Publishing requires npm CLI >= 11.5.1 (Node 22 ships
      # with npm 10.x). Upgrade just before publish.
      - name: Upgrade npm to latest (for OIDC support)
        run: npm install -g npm@latest

      # Authenticated via npm Trusted Publishing (OIDC). No long-lived
      # token in GitHub secrets — the `id-token: write` permission above
      # lets npm exchange the GitHub Actions OIDC token for an
      # ephemeral publish credential, scoped to this exact repo + workflow.
      #
      # We `cd cli` and use `npm publish` directly (not `pnpm publish`)
      # because OIDC trusted publishing is implemented in the npm CLI,
      # not pnpm.
      #
      # Setup once on npmjs.com:
      #   Package → Settings → Publishing access → Add trusted publisher
      #   Provider: GitHub Actions
      #   Repository: Jason-chen-taiwan/vulnscope
      #   Workflow filename: release-cli.yml
      #   Environment: (leave blank)
      - name: Publish to npm
        working-directory: cli
        run: npm publish --access public --provenance
