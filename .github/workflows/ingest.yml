# ══════════════════════════════════════════════════════════════════════════════
# ingest.yml — Scheduled data refresh: OSV/KEV/EPSS → Cloudflare D1
# ══════════════════════════════════════════════════════════════════════════════
#
# Required repo secret
# ─────────────────────
#   CLOUDFLARE_API_TOKEN   D1 edit scope (Workers D1:Edit permission).
#   Add in: GitHub repo → Settings → Secrets and variables → Actions → New.
#
# Free-tier constraints and schedule rationale
# ─────────────────────────────────────────────
#   GitHub Actions free tier: 2 000 min/month for PRIVATE repos (unlimited
#   for public).  A full 13-ecosystem OSV ingest takes 1–2 hours — running it
#   daily would consume the entire private-repo budget.
#
#   Cloudflare D1 free tier: 100 000 write rows/day.  A full OSV push writes
#   hundreds of thousands of rows, so a DAILY full push would exceed the cap.
#
#   Steady-state design (free tier):
#     DAILY  (05:00 UTC)  — Incremental OSV (changed records since each
#                           ecosystem's watermark) + full KEV + EPSS refresh.
#                           Write footprint: changed OSV records plus KEV/EPSS
#                           (~24k–39k row-units/day, well under the 100k/day
#                           free cap).  Runtime is minutes in steady state;
#                           the first cold-start run is larger (7-day window
#                           across 13 ecosystems) and may take up to ~60 min.
#     ON DEMAND (manual)  — Full 13-ecosystem OSV refresh.  ~677k row writes,
#                           over the free 100k/day cap, so it is NOT scheduled.
#                           Run via workflow_dispatch (ecosystems="full") on
#                           Workers Paid when OSV vuln data needs a full rebuild.
#
# How KEV/EPSS-only works in the MANUAL (workflow_dispatch) job (INGEST_ECOSYSTEMS=" ")
# ──────────────────────────────────────────────────────────────────────────────────────
#   NOTE: This mechanism is used by the MANUAL job's "KEV+EPSS only" mode
#   (empty ecosystems input). The daily scheduled job no longer uses this path —
#   it runs build:sqlite:incremental, which always ingests OSV incrementally.
#
#   build-sqlite.ts reads INGEST_ECOSYSTEMS and evaluates:
#     const ecosystems = (process.env.INGEST_ECOSYSTEMS
#       ? INGEST_ECOSYSTEMS.split(",").map(s=>s.trim()).filter(Boolean)
#       : DEFAULT_ECOSYSTEMS);
#   A single-space value " " is truthy → splits to [" "] → trim → [""] →
#   filter(Boolean) → [].  An empty array means the OSV loop body never runs.
#   The script then always runs ingestKev() and ingestEpss() unconditionally,
#   so those two sources are refreshed regardless.  The resulting SQLite file
#   contains only KEV/EPSS enrichments applied on top of an empty OSV base.
#
# push-to-d1.sh modes: full vs delta (and WHY it matters)
# ─────────────────────────────────────────────────────────
#   DELTA (PUSH_MODE=delta) — daily.  MERGES the delta SQLite onto D1's existing
#   data; it NEVER drops tables.  vulnerabilities/packages are UPSERTed; each
#   child table (affected/cvss_scores/vuln_aliases/refs) is replaced ONLY for the
#   cve_ids the delta actually carries rows for — so a KEV/EPSS-only delta (which
#   carries no child rows) leaves every existing OSV affected/cvss/ref/alias row
#   untouched while still applying the day's KEV/EPSS updates.
#     WHY THIS EXISTS: the old script DROPPED all base tables before every import.
#     Because the daily build is KEV/EPSS-only (no OSV), each daily run WIPED all
#     OSV data (the bulk of CVEs) from D1 until the weekly full refresh — the site
#     was broken 6 days out of 7.  Delta mode fixes that data-loss bug.
#
#   FULL (PUSH_MODE=full) — weekly + cold seed.  DROP + recreate + import + rebuild
#   FTS.  Correct because the weekly build contains ALL data, so a full replace
#   loses nothing and is the simplest way to reset ids/FTS cleanly.
#
# First cold seed
# ────────────────
#   The initial full dataset is seeded MANUALLY in Phase 6 (run locally or
#   via workflow_dispatch with ecosystems=full).  This scheduled workflow is
#   NOT triggered on the first push — it only maintains an already-seeded D1.
#   After the seed, the daily scheduled job keeps OSV data fresh incrementally
#   (changed records since each ecosystem's watermark); a FULL OSV rebuild
#   remains manual-only.
# ══════════════════════════════════════════════════════════════════════════════

name: Ingest → D1

on:
  # Daily incremental OSV + KEV + EPSS delta push. Pulls OSV records changed
  # since each ecosystem's watermark, plus a full KEV/EPSS refresh — minutes in
  # steady state, under the D1 free 100k/day write cap. A full 13-ecosystem OSV
  # rebuild (~677k rows) is NOT scheduled; run on demand via workflow_dispatch
  # (ecosystems="full") when a full refresh is needed.
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC every day → incremental OSV + KEV/EPSS delta

  # Manual trigger: optionally override ecosystems (empty = KEV/EPSS only,
  # "full" = all 13 defaults, or comma-separated list e.g. "npm,PyPI")
  workflow_dispatch:
    inputs:
      incremental:
        description: |
          Run the INCREMENTAL OSV build (build:sqlite:incremental) instead of
          the full/KEV-EPSS build. This is the same path the daily cron runs:
          it ingests only OSV records changed since each ecosystem's D1
          watermark, plus KEV/EPSS, and delta-pushes. Use this to test or run
          the incremental mechanism on demand.
        type: boolean
        required: false
        default: false
      ecosystems:
        description: |
          Ecosystems to ingest (comma-separated).
          For incremental=true: limit to these ecosystems (empty = all 13).
            e.g. "npm" for a small, safe first run.
          For incremental=false: empty = KEV+EPSS only; "full" = all 13
            default ecosystems; or a comma list (partial full build).
        required: false
        default: ""

# ── Jobs ─────────────────────────────────────────────────────────────────────

jobs:
  # On the FIRST incremental run, D1's sync_state is empty, so each ecosystem
  # cold-starts at "7 days ago" (one-time larger delta, still under the free
  # cap). Subsequent runs pull ~1 day each.

  # ── Daily: OSV incremental + KEV + EPSS ───────────────────────────────────
  refresh-daily:
    name: "Daily: OSV incremental + KEV + EPSS"
    # Run only on the daily cron (05:00 UTC), not on workflow_dispatch
    # (handled by the manual job below).
    if: github.event_name == 'schedule' && github.event.schedule == '0 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60   # cold-start pulls 7d across 13 ecosystems; steady-state is minutes

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SQLite — incremental OSV + KEV + EPSS
        # Reads per-ecosystem watermarks from D1 (carried in the SQLite's
        # sync_state after the previous push), ingests only OSV records changed
        # since, plus a full KEV/EPSS refresh. Default ecosystems = all 13.
        env:
          SQLITE_OUT: scratch-phase0/vulnscope-incremental.sqlite
        run: pnpm build:sqlite:incremental

      - name: Push to D1 (delta — merge changed OSV + KEV/EPSS, advance watermarks)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUSH_MODE: delta
        run: bash scripts/push-to-d1.sh scratch-phase0/vulnscope-incremental.sqlite vulnscope-v2 delta

  # NOTE: There is intentionally NO scheduled weekly full-refresh job. A full
  # 13-ecosystem OSV DROP+rebuild writes ~677k rows, far over the D1 free
  # 100k/day cap. OSV data changes slowly, so a full refresh is run ON DEMAND
  # via the manual job below (Actions → "Ingest → D1" → Run workflow →
  # ecosystems="full") — do that while the account is on Workers Paid, or after
  # splitting the push across days. Daily KEV/EPSS deltas keep the site current.

  # ── Manual: workflow_dispatch with optional ecosystem override ──────────────
  refresh-manual:
    name: "Manual: ${{ github.event.inputs.incremental == 'true' && 'incremental OSV' || (github.event.inputs.ecosystems || 'KEV+EPSS only') }}"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Incremental path (incremental=true): same as the daily cron. Ingests
      #    only OSV records changed since each ecosystem's watermark + KEV/EPSS,
      #    then delta-pushes. `ecosystems` optionally limits which ecosystems
      #    (empty = all 13). Use e.g. ecosystems="npm" for a small first run. ──
      - name: Build SQLite — incremental OSV + KEV + EPSS
        if: github.event.inputs.incremental == 'true'
        env:
          SQLITE_OUT: scratch-phase0/vulnscope-incremental.sqlite
          # Empty → build:sqlite:incremental defaults to all 13 ecosystems.
          INGEST_ECOSYSTEMS: ${{ github.event.inputs.ecosystems }}
        run: pnpm build:sqlite:incremental

      - name: Push to D1 (incremental delta)
        if: github.event.inputs.incremental == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUSH_MODE: delta
        run: bash scripts/push-to-d1.sh scratch-phase0/vulnscope-incremental.sqlite vulnscope-v2 delta

      # ── Non-incremental path (incremental=false): the legacy full / KEV-EPSS
      #    build, kept for on-demand full OSV rebuilds. ──
      - name: Resolve ecosystems input
        id: eco
        if: github.event.inputs.incremental != 'true'
        # "full" → unset INGEST_ECOSYSTEMS (use default 13-list) + PUSH_MODE=full
        #          (a full build has ALL data, so a DROP+rebuild is correct).
        # ""     → single space (KEV+EPSS only) + PUSH_MODE=delta (never wipe OSV).
        # other  → pass through verbatim + PUSH_MODE=delta (partial build merges,
        #          replacing only the cve_ids it carries).
        run: |
          INPUT="${{ github.event.inputs.ecosystems }}"
          if [[ "$INPUT" == "full" ]]; then
            echo "value=" >> "$GITHUB_OUTPUT"
            echo "push_mode=full" >> "$GITHUB_OUTPUT"
          elif [[ -z "$INPUT" ]]; then
            echo "value= " >> "$GITHUB_OUTPUT"
            echo "push_mode=delta" >> "$GITHUB_OUTPUT"
          else
            echo "value=$INPUT" >> "$GITHUB_OUTPUT"
            echo "push_mode=delta" >> "$GITHUB_OUTPUT"
          fi

      - name: Build SQLite
        if: github.event.inputs.incremental != 'true'
        env:
          INGEST_ECOSYSTEMS: ${{ steps.eco.outputs.value }}
        run: pnpm build:sqlite

      - name: Push to D1
        if: github.event.inputs.incremental != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUSH_MODE: ${{ steps.eco.outputs.push_mode }}
        run: bash scripts/push-to-d1.sh vulnscope-v2
