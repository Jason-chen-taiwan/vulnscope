name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (web)
        run: pnpm exec tsc --noEmit

      - name: Typecheck (cli)
        run: pnpm --filter vulnscope exec tsc --noEmit

      - name: Test (all packages)
        # -r runs `test` in every workspace package. Web app + CLI both
        # define one, so this single command covers everything.
        run: pnpm -r test
