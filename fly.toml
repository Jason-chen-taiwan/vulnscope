# fly.toml app configuration file generated for vulnscope-tw on 2026-05-28T13:06:54+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vulnscope-tw'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'vulnscope_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  # We can't auto-stop the machine: the in-process scheduler runs a 30+
  # minute OSV ingest every 24h and gets killed mid-flight if Fly stops
  # us for idleness. Keep one machine running. Cost: ~$3/month, within
  # the $5 free credit allowance.
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 300
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
