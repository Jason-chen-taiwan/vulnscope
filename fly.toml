# fly.toml app configuration file for vulnscope-tw
#
# Two process groups share one Docker image:
#   web    — Next.js HTTP server, no scheduler
#   worker — scheduler + ingest, HTTP server unused
# PROCESS_ROLE env tells instrumentation-node.ts which side to boot.
#
# See https://fly.io/docs/reference/configuration/ for syntax details.

app = 'vulnscope-tw'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[processes]
  web    = "node server.js"
  worker = "node server.js"

[processes.web.env]
  PROCESS_ROLE = "web"

[processes.worker.env]
  PROCESS_ROLE = "worker"

[[mounts]]
  source = 'vulnscope_data'
  destination = '/data'
  processes = ['worker']

[http_service]
  internal_port = 3000
  force_https = true
  # The worker runs the daily OSV ingest (1-2h) and gets killed mid-flight
  # if Fly stops it for idleness — but auto_stop_machines applies per
  # process group. Keep both running. min_machines_running below covers
  # the web side; worker has its own [[vm]] block.
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['web']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 300
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  processes = ['web']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  processes = ['worker']
