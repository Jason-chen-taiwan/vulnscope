# fly.toml app configuration file for vulnscope-tw
#
# Two process groups share one Docker image:
#   web    — Next.js HTTP server, no scheduler
#   worker — scheduler + ingest, HTTP server unused
# PROCESS_ROLE env tells instrumentation-node.ts which side to boot.
#
# See https://fly.io/docs/reference/configuration/ for syntax details.

app = 'vulnscope-tw'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[processes]
  # PROCESS_ROLE is set via env-prefix in the command string itself.
  # Fly's `[processes]` is a string→string map (inline-table syntax),
  # so per-process env tables (`[processes.web.env]`) are not allowed
  # in the same config — they'd require turning [processes] into a
  # nested table, which conflicts with the string-map form Fly expects.
  web    = "sh -c 'PROCESS_ROLE=web node server.js'"
  worker = "sh -c 'PROCESS_ROLE=worker node server.js'"

[http_service]
  internal_port = 3000
  force_https = true
  # The worker runs the daily OSV ingest (1-2h) and gets killed mid-flight
  # if Fly stops it for idleness. auto_stop_machines applies per process
  # group, so keeping it off here also covers worker continuity.
  auto_stop_machines = 'off'
  auto_start_machines = false
  # min_machines_running=0 instead of 1: setting it to 1 makes Fly
  # auto-provision a second web machine for HA ($2.67/mo extra). For a
  # personal/hobby tier we accept the ~30s deploy-window downtime in
  # exchange for ~$3/mo savings. Re-enable HA by flipping back to 1 if
  # the project scales.
  min_machines_running = 0
  processes = ['web']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 300
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  processes = ['web']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  processes = ['worker']
