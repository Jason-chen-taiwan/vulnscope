# Optional one-step Postgres for contributors without Homebrew.
# Equivalent to `pnpm db:start`. Exposes the same port (55432) and same
# credentials so your .env.local works unchanged.
services:
  postgres:
    image: postgres:16
    container_name: cvehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cvehub
      POSTGRES_PASSWORD: cvehub
      POSTGRES_DB: cvehub
    ports:
      - "55432:5432"
    volumes:
      - cvehub-pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvehub -d cvehub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cvehub-pgdata:
