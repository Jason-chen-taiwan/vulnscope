# Optional one-step Postgres for contributors without Homebrew.
# Equivalent to `pnpm db:start`. Exposes the same port (55432) and same
# credentials so your .env.local works unchanged.
services:
  postgres:
    image: postgres:16
    container_name: vulnscope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vulnscope
      POSTGRES_PASSWORD: vulnscope
      POSTGRES_DB: vulnscope
    ports:
      - "55432:5432"
    volumes:
      - vulnscope-pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnscope -d vulnscope"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vulnscope-pgdata:
